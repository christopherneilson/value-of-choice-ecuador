name: engine tests and link check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Engine reproduces the Python fixtures
        run: node engine/test_engine.mjs
      - name: Local links resolve
        run: node tools/check_links.mjs
